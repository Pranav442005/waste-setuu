<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kabadiwala | Portal Dashboard</title>
<link rel="stylesheet" href="../assets/css/styles.css">
<style>
.ws-work{min-height:100vh;background:#f4f8f5;color:#18352a;font-family:inherit}.ws-top{background:#fff;border-bottom:1px solid #dce9df;padding:16px 4%;display:flex;align-items:center;justify-content:space-between}.ws-top h2{margin:0;color:#176b45}.ws-shell{display:grid;grid-template-columns:240px 1fr;gap:24px;padding:24px 4%;max-width:1500px;margin:auto}.ws-side,.ws-panel,.ws-card{background:#fff;border:1px solid #e0eae3;border-radius:14px}.ws-side{padding:18px;height:max-content}.ws-side button{width:100%;display:block;text-align:left;padding:12px;margin:4px 0;border:0;border-radius:8px;background:transparent;color:#234536;cursor:pointer}.ws-side button.active,.ws-side button:hover{background:#e8f4ec;color:#14683f}.ws-panel{padding:24px;min-height:540px}.ws-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.ws-card{padding:16px;margin:12px 0}.ws-card h3{margin:0 0 8px}.ws-muted{color:#6a7e72;font-size:13px}.ws-btn{border:0;border-radius:8px;padding:10px 14px;background:#176b45;color:#fff;cursor:pointer;margin:5px 5px 5px 0}.ws-btn.alt{background:#e7f2ea;color:#176b45}.ws-btn:disabled{opacity:.5}.ws-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.ws-form input,.ws-form select,.ws-form textarea,.ws-card input,.ws-card textarea{width:100%;padding:11px;border:1px solid #cfddd2;border-radius:8px;box-sizing:border-box}.ws-form textarea{grid-column:1/-1}.ws-form button{grid-column:1/-1}.ws-tag{display:inline-block;padding:4px 9px;border-radius:20px;background:#e8f4ec;color:#176b45;font-size:12px}.ws-alert{padding:10px;background:#f1f7f2;border-radius:8px;margin:10px 0}.ws-hidden{display:none!important}@media(max-width:760px){.ws-shell{grid-template-columns:1fr}.ws-side{display:flex;overflow:auto}.ws-side button{min-width:max-content}.ws-form{grid-template-columns:1fr}}
</style>
</head>
<body class="ws-work">
<header class="ws-top"><div><h2>Waste Setu</h2><span class="ws-muted" id="accountLine">Portal workspace</span></div><button class="ws-btn alt" id="logout">Logout</button></header>
<div class="ws-shell">
<nav class="ws-side" id="menu"></nav>
<main class="ws-panel"><div id="view"></div><div id="notice" class="ws-alert ws-hidden"></div></main>
</div>
<script src="../assets/js/role-dashboard.js"></script>

<script src="../assets/js/waste-setu-assistant.js" defer></script>
</body></html>
